<rect x="343.7" y="26" width="112.3" height="22" rx="11" fill="#DAFBE1" stroke="#238636"/><text class="mono" x="399.9" y="41" font-size="10.5" letter-spacing=".8" fill="#1A7F37" text-anchor="middle">PUBLIC REPO ↗</text>
<text class="sans" x="24" y="100" font-size="15" fill="#424A53">A chat assistant that answers questions about my</text>
