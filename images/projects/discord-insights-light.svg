  <clipPath id="cl"><rect x="1" y="1" width="478" height="222" rx="16"/></clipPath>
</defs>
<g class="r">
<rect x="1" y="1" width="478" height="222" rx="16" fill="#FFFFFF"/>
<g clip-path="url(#cl)"><circle cx="0" cy="0" r="260" fill="url(#tint)"/><rect width="480" height="3" fill="url(#acc)"/></g>
