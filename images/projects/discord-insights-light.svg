<svg xmlns="http://www.w3.org/2000/svg" width="480" height="224" viewBox="0 0 480 224" fill="none" role="img" aria-label="Discord Insights — conversational analytics agent. Ask your data questions in plain English. An agent writes the SQL, checks it as an AST, runs it read-only and streams answers and charts back live over SSE. Stack: python · fastapi · postgresql · react · docker">
<title>Discord Insights — conversational analytics agent. Ask your data questions in plain English. An agent writes the SQL, checks it as an AST, runs it read-only and streams answers and charts back live over SSE. Stack: python · fastapi · postgresql · react · docker</title>
<style>
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Inter,Arial,sans-serif}
.mono{font-family:'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulse{from{opacity:.5}to{opacity:1}}
@keyframes blink{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.r{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}</style>
<defs>
