<svg xmlns="http://www.w3.org/2000/svg" width="480" height="224" viewBox="0 0 480 224" fill="none" role="img" aria-label="E-commerce Churn ML — customer churn prediction. Predicts which e-commerce customers are about to leave, using an XGBoost model tuned end to end with cross-validated grid search. Stack: python · xgboost · scikit-learn">
<title>E-commerce Churn ML — customer churn prediction. Predicts which e-commerce customers are about to leave, using an XGBoost model tuned end to end with cross-validated grid search. Stack: python · xgboost · scikit-learn</title>
<style>
