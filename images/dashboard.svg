<svg width="800" height="170" viewBox="0 0 800 170" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="170" rx="16" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>
  
  <!-- Left Column: Total Contributions -->
  <g transform="translate(30, 25)">
    <circle cx="24" cy="24" r="20" fill="url(#violet-grad)"/>
    <path d="M24 14L28 20H20L24 14Z" fill="#FFF"/>
    <path d="M24 34L20 28H28L24 34Z" fill="#FFF"/>
    <text x="60" y="22" fill="#8B949E" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Total Contributions</text>
    <text x="60" y="52" fill="#58A6FF" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800">2,480+</text>
    <text x="60" y="75" fill="#7EE787" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">⚡ 23 Active Repositories</text>
  </g>

  <!-- Divider 1 -->
  <line x1="280" y1="30" x2="280" y2="140" stroke="#21262D" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Middle Column: Current Streak -->
  <g transform="translate(310, 25)">
    <circle cx="24" cy="24" r="20" fill="url(#fire-grad)"/>
    <text x="24" y="30" text-anchor="middle" font-size="18">🔥</text>
    <text x="60" y="22" fill="#8B949E" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Current Streak</text>
    <text x="60" y="52" fill="#FF7B72" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800">Active</text>
    <text x="60" y="75" fill="#8B949E" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">Weekly Shipping Cadence</text>
  </g>

  <!-- Divider 2 -->
  <line x1="550" y1="30" x2="550" y2="140" stroke="#21262D" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Right Column: Primary Domain -->
  <g transform="translate(580, 25)">
    <circle cx="24" cy="24" r="20" fill="url(#gold-grad)"/>
    <text x="24" y="30" text-anchor="middle" font-size="18">🏆</text>
    <text x="60" y="22" fill="#8B949E" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Primary Domain</text>
    <text x="60" y="52" fill="#D2A8FF" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800">AI &amp; Agents</text>
    <text x="60" y="75" fill="#79C0FF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">Python · FastAPI · SQL</text>
  </g>

  <!-- Gradients -->
  <defs>
    <linearGradient id="violet-grad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="fire-grad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF7B72"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D2A8FF"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
  </defs>
</svg>
