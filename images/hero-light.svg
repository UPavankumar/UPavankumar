<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" fill="none" role="img" aria-label="Pavan Kumar — AI Engineer building AI agents, real-time voice AI and automation">
<title>Pavan Kumar — AI Engineer building AI agents, real-time voice AI and automation</title>
<style>
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Inter,Arial,sans-serif}
.mono{font-family:'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulse{from{opacity:.5}to{opacity:1}}
@keyframes blink{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.glow{animation:pulse 7s ease-in-out infinite alternate}
.glow.g2{animation-delay:-3.5s}
.bar{transform-box:fill-box;transform-origin:center;animation:eq 1.1s ease-in-out infinite alternate}
@keyframes eq{from{transform:scaleY(.18)}to{transform:scaleY(1)}}
.r{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.live{animation:blink 1.6s ease-in-out infinite}
.p{fill:#7C3AED}.c{fill:#1F2328}.o{fill:#59636E}.h{fill:#6D28D9}.ok{fill:#1A7F37}.dim{fill:#8C959F}.bl{fill:#0969DA}
</style>
