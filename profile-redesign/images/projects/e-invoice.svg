.mono{font-family:'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
