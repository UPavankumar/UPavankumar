<rect x="365.0" y="26" width="91.0" height="22" rx="11" fill="#1E1433" stroke="#6E40C9"/><text class="mono" x="410.5" y="41" font-size="10.5" letter-spacing=".8" fill="#C4B5FD" text-anchor="middle">ENTERPRISE</text>
<text class="sans" x="24" y="100" font-size="15" fill="#C9D1D9">Pulls invoice data out of PDFs and spreadsheets, maps</text>
