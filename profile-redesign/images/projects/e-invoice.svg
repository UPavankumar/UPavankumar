<svg xmlns="http://www.w3.org/2000/svg" width="480" height="224" viewBox="0 0 480 224" fill="none" role="img" aria-label="e-Invoice Pipeline — multi-tenant ETL · compliance. Pulls invoice data out of PDFs and spreadsheets, maps it to JSON schema and files Malaysian LHDN e-Invoices across tenants — 2,000+ documents every month. Stack: python · microsoft graph · rest apis · oauth 2.0">
<title>e-Invoice Pipeline — multi-tenant ETL · compliance. Pulls invoice data out of PDFs and spreadsheets, maps it to JSON schema and files Malaysian LHDN e-Invoices across tenants — 2,000+ documents every month. Stack: python · microsoft graph · rest apis · oauth 2.0</title>
<style>
