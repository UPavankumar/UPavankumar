</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7C3AED"/><stop offset="1" stop-color="#2563EB"/></linearGradient></defs>
<rect x=".5" y=".5" width="122" height="43" rx="21.5" fill="#1F2937" stroke="#ffffff" stroke-opacity=".14"/>
<g transform="translate(24 13)"><g stroke="#fff" stroke-width="1.6" fill="none" stroke-linejoin="round"><rect x=".8" y="2.8" width="16.4" height="12.4" rx="2.2"/><path d="M1.5 4l7.5 6 7.5-6"/></g></g>
<text class="sans" x="52" y="27.5" font-size="15" font-weight="700" fill="#fff" letter-spacing=".2">Email</text>
</svg>
